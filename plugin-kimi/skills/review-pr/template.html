<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EDF1; --surface:#FFFFFF; --ink:#17222D; --soft:#5B6876; --line:#D3DAE1; --blue:#2D5BD3;
    --red:#C2362F; --red-bg:#FBEAE8; --amber:#A8701A; --amber-bg:#FBF1DF; --green:#2F7D5B; --green-bg:#E4F2EA;
    --paper:#F6F8FA; --edge:#C3CCD6; --mute:#8995A2; --num:#9AA5B1; --grid:#D3DAE1;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111922; --surface:#18222D; --ink:#E6ECF2; --soft:#9AA8B6; --line:#2A3846; --blue:#7EA0F0;
      --red:#F07A72; --red-bg:#3A1F1E; --amber:#E0A955; --amber-bg:#36291A; --green:#6CC59B; --green-bg:#18332A;
      --paper:#141D27; --edge:#3A4A5A; --mute:#7C8B9A; --num:#5F6E7D; --grid:#1F2A36;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Schibsted Grotesk",system-ui,sans-serif}
  code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;font-variant-ligatures:none}
  a{color:inherit}
  a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}

  .pr{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:14px}
  .pr h1{font-size:20px;margin:0;font-weight:600}
  .pr .who{color:var(--soft)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:999px;text-decoration:none}
  a.tag:hover{border-color:var(--blue)}
  .banner{margin:0 0 14px;padding:8px 14px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:14px}

  .hero{display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .hero.solo{grid-template-columns:1fr}
  .verdict{padding:26px 28px;border-left:10px solid var(--vc)}
  .v-red{--vc:var(--red)}.v-amber{--vc:var(--amber)}.v-green{--vc:var(--green)}
  .verdict .big{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--vc);margin:0 0 10px}
  .verdict p{margin:0;font-size:17px;max-width:34ch}
  .lanes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}
  .hero.solo .lanes{grid-template-columns:repeat(4,1fr)}
  .lane{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
  .lane .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
  .lane small{display:block;color:var(--soft);font-size:12px;line-height:1.2}
  .d-red{background:var(--red)}.d-amber{background:var(--amber)}.d-green{background:var(--green)}
  .map{background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--paper);
      padding:14px;display:flex;flex-direction:column}
  .map .cap{font-size:13px;color:var(--soft);margin:0 0 4px}
  .map svg{width:100%;height:auto;flex:1}
  svg .nb{fill:var(--surface)} svg .tx{fill:var(--ink)} svg .ts{fill:var(--soft)} svg .tm{fill:var(--mute)}
  svg .eb{stroke:var(--blue)} svg .er{stroke:var(--red)} svg .eg{stroke:var(--edge)}
  svg .fr{fill:var(--red)} svg .fb{fill:var(--blue)}
  svg .sk-r{stroke:var(--red)} svg .sk-b{stroke:var(--blue)} svg .sk-g{stroke:var(--edge)}
  svg .st-ok{fill:var(--green-bg);stroke:var(--green)} svg .st-flag{fill:var(--red-bg);stroke:var(--red)} svg .st-n{fill:var(--surface);stroke:var(--edge)}
  svg .tg{fill:var(--green)} svg .tr{fill:var(--red)}
  svg .lg{stroke:var(--green)}

  .findings{margin-top:22px;display:grid;gap:12px}
  .f{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .f.solo{grid-template-columns:1fr}
  .f .txt{padding:16px 18px;border-left:6px solid var(--red)}
  .f.saran .txt{border-left-color:var(--amber)}
  .f.info .txt{border-left-color:var(--blue)}
  .f h3{margin:0 0 4px;font-size:17px}
  .f .loc{color:var(--soft);font-size:13px;margin:0 0 10px}
  .f .lv{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--red-bg);color:var(--red);margin-right:6px}
  .f.saran .lv{background:var(--amber-bg);color:var(--amber)}
  .f.info .lv{background:var(--bg);color:var(--blue)}
  .f .ln{font-size:12px;color:var(--soft);margin-right:6px}
  .chip-stale{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber);margin:0 0 8px}
  .draft{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
  .draft q{quotes:none;display:block;margin-bottom:8px}
  .copy{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--ink);color:var(--surface);padding:5px 12px;border-radius:6px;cursor:pointer}
  .ev{background:var(--paper);padding:16px 18px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;min-width:0}
  .ev svg{width:100%;height:auto}

  .cmp{width:100%;border-collapse:collapse;font-size:13px}
  .cmp th{font-weight:600;text-align:left;color:var(--soft);padding:4px 8px}
  .cmp td{padding:6px 8px;border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none;font-size:12.5px}
  .cmp tr.bad td{background:var(--red-bg)}
  .cmp tr.bad td:first-child{color:var(--red);font-weight:600}

  .code{width:100%;font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-ligatures:none;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
  .code div{padding:2px 10px;white-space:pre}
  .code .hl{background:var(--amber-bg);box-shadow:inset 3px 0 var(--amber)}
  .code .n{color:var(--num);display:inline-block;width:2.6em;user-select:none}

  .ok-row{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:12px;color:var(--soft)}
  .ok-row b{color:var(--green);flex:none}
  .foot{margin-top:18px;color:var(--soft);font-size:12px}

  @media (max-width:760px){
    .hero,.f{grid-template-columns:1fr}
    .ev{border-left:0;border-top:1px solid var(--line)}
    .verdict{padding:22px 20px}
    .verdict .big{font-size:44px}
    .lanes,.hero.solo .lanes{grid-template-columns:1fr}
    .ok-row{align-items:flex-start;flex-direction:column;gap:4px}
  }
  @media (prefers-reduced-motion:no-preference){
    .verdict .big{animation:stamp .5s cubic-bezier(.2,.9,.3,1.3) both}
    @keyframes stamp{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
  }
</style>
</head>
<body>
<main class="wrap">
<!-- CONTENT -->
</main>
<script>
  document.querySelectorAll('.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-copy') || '';
      var done = function () { b.textContent = 'Tersalin'; setTimeout(function () { b.textContent = 'Copy komentar'; }, 1500); };
      if (navigator.clipboard && window.isSecureContext !== false) {
        navigator.clipboard.writeText(t).then(done, function () { fallback(t); done(); });
      } else { fallback(t); done(); }
    });
  });
  function fallback(t) {
    var a = document.createElement('textarea');
    a.value = t; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(a);
  }
</script>
</body>
</html>
